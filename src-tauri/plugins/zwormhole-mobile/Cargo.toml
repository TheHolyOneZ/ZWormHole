[package]
name = "tauri-plugin-zwormhole-mobile"
version = "0.2.1"
description = "Native Android and iOS integration for ZWormHole"
authors = ["TheHolyOneZ"]
license = "GPL-3.0-only"
edition = "2021"
links = "tauri-plugin-zwormhole-mobile"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
