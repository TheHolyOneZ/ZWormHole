[package]
name = "zwormhole"
version = "0.2.0"
description = "LAN-first encrypted peer-to-peer file transfer"
authors = ["TheHolyOneZ"]
license = "GPL-3.0-only"
homepage = "https://zsync.eu/zwormhole/"
edition = "2021"

[lib]
name = "zwormhole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.20.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
gethostname = "1.1.0"
spake2 = "0.4.0"
rand = "0.10.2"
blake3 = "1.8.5"
quinn = "0.11.11"
snow = "0.10.0"
rcgen = "0.14.8"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
hex = "0.4.3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
igd-next = { version = "0.15", features = ["aio_tokio"] }
natpmp = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-zwormhole-mobile = { path = "plugins/zwormhole-mobile" }

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3

