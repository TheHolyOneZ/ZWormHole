name: Build ZWormHole Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the binaries to (must already exist)"
        required: false
        default: "0.1.0"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

  RELEASE_TAG: ${{ github.event.inputs.release_tag || '0.1.0' }}

  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: List bundle output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== All bundle files ==="
          Get-ChildItem -Recurse src-tauri/target -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Bundle directory tree ==="
          Get-ChildItem -Recurse src-tauri/target -Directory -Filter bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Publish Windows binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
          fail_on_unmatched_files: true


  build-macos-intel:
    name: macOS Intel x64 (cross-compiled)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-intel

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Intel x64, cross-compiled)
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish macOS Intel binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/**/*.dmg
          fail_on_unmatched_files: true


  build-macos-silicon:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-silicon

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Apple Silicon, native)
        run: pnpm tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish macOS Apple Silicon binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/**/*.dmg
          fail_on_unmatched_files: true


  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            rpm \
            libdbus-1-dev \
            libasound2-dev \
            pkg-config

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — deb + AppImage + rpm
        run: pnpm tauri build --bundles deb,appimage,rpm --target x86_64-unknown-linux-gnu
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish Linux binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
          fail_on_unmatched_files: true


  checksums:
    name: Generate SHA-256 checksums
    needs: [build-windows, build-macos-intel, build-macos-silicon, build-linux]
    runs-on: ubuntu-22.04
    if: always() && !cancelled()
    permissions:
      contents: write

    steps:
      - name: Download release binaries, checksum, and re-upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release && cd release
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage' \
            --clobber
          echo "=== release/ ==="
          ls -lah
          (sha256sum *.msi *.exe *.dmg *.deb *.rpm *.AppImage 2>/dev/null || true) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
