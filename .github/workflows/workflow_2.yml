name: Build ZWormHole Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the binaries to (must already exist)"
        required: false
        default: "0.2.0"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/workflow_2.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

  RELEASE_TAG: ${{ github.event.inputs.release_tag || '0.2.0' }}

  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: List bundle output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== All bundle files ==="
          Get-ChildItem -Recurse src-tauri/target -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Bundle directory tree ==="
          Get-ChildItem -Recurse src-tauri/target -Directory -Filter bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Publish Windows binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
          fail_on_unmatched_files: true


  build-macos-intel:
    name: macOS Intel x64 (cross-compiled)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-intel

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Intel x64, cross-compiled)
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish macOS Intel binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/**/*.dmg
          fail_on_unmatched_files: true


  build-macos-silicon:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-silicon

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Apple Silicon, native)
        run: pnpm tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish macOS Apple Silicon binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/target/**/release/bundle/**/*.dmg
          fail_on_unmatched_files: true


  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            rpm \
            libdbus-1-dev \
            libasound2-dev \
            pkg-config

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — deb + AppImage + rpm
        run: pnpm tauri build --bundles deb,appimage,rpm --target x86_64-unknown-linux-gnu
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Publish Linux binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm
          fail_on_unmatched_files: true


  build-android:
    name: Android (arm64 + armv7)
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Android project
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          pnpm tauri android init --ci
          pnpm tauri icon src-tauri/icons/source-1024.png
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/release.jks
            printf 'keyAlias=%s\npassword=%s\nstoreFile=release.jks\n' "${KEY_ALIAS:-zwormhole}" "$KEY_PASSWORD" > src-tauri/gen/android/keystore.properties
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set – signing with a throwaway key. Users must uninstall before updating to a build signed with a different key."
            keytool -genkeypair -v -keystore src-tauri/gen/android/release.jks -alias zwormhole -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass zwormhole-ci -keypass zwormhole-ci -dname "CN=ZWormHole, O=TheHolyOneZ"
            printf 'keyAlias=zwormhole\npassword=zwormhole-ci\nstoreFile=release.jks\n' > src-tauri/gen/android/keystore.properties
          fi
          pnpm android:setup

      - name: Build — APK
        run: pnpm tauri android build --apk --target aarch64 --target armv7

      - name: Rename APK
        run: |
          V=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" | head -1)
          if [ -z "$APK" ]; then echo "no release APK found"; exit 1; fi
          mkdir -p dist-mobile
          cp "$APK" "dist-mobile/ZWormHole_${V}_android.apk"
          ls -la dist-mobile

      - name: Publish Android APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist-mobile/*.apk
          fail_on_unmatched_files: true


  build-ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: ios

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS project without code signing
        run: |
          pnpm tauri ios init --ci
          pnpm tauri icon src-tauri/icons/source-1024.png
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nCODE_SIGN_ENTITLEMENTS =\nDEVELOPMENT_TEAM =\nPROVISIONING_PROFILE_SPECIFIER =\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/unsigned.xcconfig" >> "$GITHUB_ENV"
          python3 scripts/ios-unsigned.py

      - name: Build — iPhone (unsigned)
        run: |
          python3 scripts/ios-unsigned.py
          pnpm tauri ios build --target aarch64 --ci || true

      - name: Package unsigned IPA
        run: |
          V=$(node -p "require('./package.json').version")
          APP=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" -path "*-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -f "$APP/Info.plist" ]; then echo "no complete .app found"; exit 1; fi
          echo "app: $APP"
          mkdir -p ipa/Payload dist-mobile
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qr "../dist-mobile/ZWormHole_${V}_ios_unsigned.ipa" Payload)
          ls -la dist-mobile

      - name: Publish iOS IPA to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist-mobile/*.ipa
          fail_on_unmatched_files: true


  checksums:
    name: Generate SHA-256 checksums
    needs: [build-windows, build-macos-intel, build-macos-silicon, build-linux, build-android, build-ios]
    runs-on: ubuntu-22.04
    if: always() && !cancelled()
    permissions:
      contents: write

    steps:
      - name: Download release binaries, checksum, and re-upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release && cd release
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage' \
            --pattern '*.apk' --pattern '*.ipa' \
            --clobber
          echo "=== release/ ==="
          ls -lah
          (sha256sum *.msi *.exe *.dmg *.deb *.rpm *.AppImage *.apk *.ipa 2>/dev/null || true) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
